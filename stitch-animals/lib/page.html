<!doctype html>
<html><head><meta charset="utf-8"><title>stitch animal</title>
<style>html,body{margin:0;background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh}
canvas{max-height:100vh;max-width:100vw}</style></head>
<body><canvas id="c"></canvas>
<script src="stitch.js"></script>
<script>
// usage: page.html?a=fox   (loads ../animals/fox.js). Plays live in a browser; the renderer calls renderFrame(t).
const name = new URLSearchParams(location.search).get('a') || 'demo';
const s = document.createElement('script');
s.src = '../animals/' + name + '.js';
s.onload = () => {
  const A = window.ANIMAL, cv = document.getElementById('c'), g = STITCH.makeGrid();
  window.renderFrame = (t) => { g.fill(A.bg || 0); A.draw(g, t % A.loop); STITCH.paint(cv, g, A.palette); };
  window.ready = true;
  if (!navigator.webdriver) {
    const t0 = performance.now();
    (function loop() { renderFrame(((performance.now() - t0) / 1000)); requestAnimationFrame(loop); })();
  }
};
document.body.appendChild(s);
</script></body></html>
