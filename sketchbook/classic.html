<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Architect's Sketchbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<main id="desk">
  <div id="stage">
    <canvas id="paper"></canvas>
    <canvas id="ink"></canvas>
    <div id="grain"></div>
  </div>
</main>
<nav id="bar">
  <button id="prev" title="Previous sheet (←)">‹</button>
  <div id="tabs"></div>
  <button id="next" title="Next sheet (→)">›</button>
  <span class="sep"></span>
  <button id="speed" title="Drawing speed">1×</button>
  <button id="redraw" title="Redraw this sheet (R)">↻ redraw</button>
  <button id="finish" title="Finish drawing (Space)">✎ finish</button>
</nav>
<script src="js/engine.js"></script>
<script src="js/engine3d.js"></script>
<script src="js/scenes/spaceship.js"></script>
<script src="js/scenes/burj.js"></script>
<script src="js/scenes/bridge.js"></script>
<script src="js/scenes/elevator.js"></script>
<script src="js/scenes/robot.js"></script>
<script src="js/scenes/pyramids.js"></script>
<script src="js/scenes/library.js"></script>
<script src="js/scenes/cathedral.js"></script>
<script src="js/scenes/watch.js"></script>
<script src="js/scenes/watch3d.js"></script>
<script src="js/scenes/nave3d.js"></script>
<script src="js/scenes/camera3d.js"></script>
<script src="js/scenes/rotunda3d.js"></script>
<script src="js/scenes/doodle3d.js"></script>
<script src="js/scenes/automatic.js"></script>
<script src="js/scenes/inkgarden.js"></script>
<script src="js/scenes/junkcathedral.js"></script>
<script src="js/scenes/clockisland.js"></script>
<script src="js/main.js"></script>
</body>
</html>
