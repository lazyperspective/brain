<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>1000 Agents — vector wireframe</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#020207;overflow:hidden}
  canvas{position:absolute;inset:0;margin:auto;max-width:100vw;max-height:100vh;aspect-ratio:16/9;width:auto;height:auto;display:block}
  @media (min-aspect-ratio:16/9){canvas{height:100vh}}
  @media (max-aspect-ratio:16/9){canvas{width:100vw}}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="js/piece.js"></script>
</body>
