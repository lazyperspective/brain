// dark base band and a waist seam, lit top with a soft specular spot, cream headband 2 units under the top with a knot at the

function topTexture() {

window.renderChar = function (o) {

  const key = new THREE.DirectionalLight(col(L.keyCol || '#ffffff'), L.key == null ? 1.1 : L.key); key.position.set(...(L.keyDir || [-6, 10, 4])); scene.add(key);

  const cap = new THREE.Mesh(new THREE.PlaneGeometry(BX - 2.4, BZ - 2.4, 6, 6), topM); cap.rotation.x = -Math.PI / 2; cap.position.y = FOOT + BY + 0.02; bakeWorld(cap); bendGeo(cap.geometry, pose.lean, pose.squash); G.add(cap);

  const faceM = withRim(new THREE.MeshStandardMaterial({ map: faceTexture(pose), transparent: true, roughness: 0.6, color: '#ffffff', polygonOffset: true, polygonOffsetFactor: -2 }), U);
  // only the features: make the canvas background transparent by drawing on clear canvas (faceTexture draws only features)

  const knot = new THREE.Mesh(new RoundedBoxGeometry(1.8, 2.4, 2.2, 2, 0.5), bandM); knot.position.copy(K); G.add(knot);

      pts.push(new THREE.Vector3(K.x + back.x * along, K.y - i * (1 - wind) * 0.95 + Math.sin(T * 13 - i + j) * 0.22 * i + wv * 0.4, K.z + back.z * along + wv + spread));

  const cam = new THREE.PerspectiveCamera(fov, W / H, 1, 2000), tgt = new THREE.Vector3(0, o.lookY == null ? 10 : o.lookY, 0);
