<!doctype html><html><head><meta charset="utf-8"><title>Field Guide style prototypes</title>
<style>html,body{margin:0;background:#111;height:100%;display:flex;align-items:center;justify-content:center}canvas{height:96vh;image-rendering:auto}</style></head>
<body><canvas id="c" width="1080" height="1350"></canvas>
<script src="js/core.js"></script><script src="js/styles.js"></script>
<script>
const q=new URLSearchParams(location.search), si=+(q.get('style')||0), S=STYLES[si];
const F=document.getElementById('c').getContext('2d'); const low=document.createElement('canvas'); low.width=LW; low.height=LH;
function renderAt(t){ const B=new PBuf(S.pal,S.amp); S.low(B,t); low.getContext('2d').clearRect(0,0,LW,LH); B.toCanvas(low);
  F.setTransform(1,0,0,1,0,0); F.clearRect(0,0,FW,FH); F.filter='none'; F.globalAlpha=1; F.globalCompositeOperation='source-over';
  if(S.compose){S.compose(F,low,t);} else { if(S.hiBack) S.hiBack(F,t); else {F.fillStyle='#000';F.fillRect(0,0,FW,FH);} pixelUp(F,low); if(S.hiFront) S.hiFront(F,t); } }
window.__piece={renderAt,count:STYLES.length,names:STYLES.map(s=>s.name+' — '+s.sub)};
if(q.has('t')) renderAt(+q.get('t')); else if(!q.has('export')){ const t0=performance.now(); (function loop(){ renderAt(((performance.now()-t0)/1000)%DUR); requestAnimationFrame(loop);})(); }
</script></body></html>
