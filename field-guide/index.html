<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fable 5.2: A Field Guide</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1630; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #out { display: block; max-width: 100vw; max-height: 100vh; aspect-ratio: 4 / 5; height: 100vh; }
  #gl { display: none; }
  #hint { position: fixed; left: 12px; bottom: 10px; color: #a99be6; font: 12px/1.3 sans-serif; opacity: .7; }
</style>
</head>
<body>
<canvas id="out" width="1080" height="1350"></canvas>
<canvas id="gl" width="1080" height="1350"></canvas>
<div id="hint"></div>
<script src="js/fonts.js"></script>
<script src="js/core.js"></script>
<script src="js/timeline.js"></script>
<script src="js/engine.js"></script>
<script src="js/text.js"></script>
<script src="js/hero.js"></script>
<script src="js/world.js"></script>
<script src="js/props.js"></script>
<script src="js/beats.js"></script>
<script src="js/camera.js"></script>
<script src="js/compositor.js"></script>
<script src="js/film.js"></script>
<script>
  /* index.html          plays the film live (best effort: it renders every frame on the CPU's WebGL and may run slower
                         than real time; the clock follows the frames, so no frame is skipped). Click to pause.
     index.html?t=12.3   freezes one frame.     index.html?export   exposes window.__piece = { renderAt(t, opts) }. */
  (function () {
    'use strict';
    var Q = new URLSearchParams(location.search);
    var opts = { ss: Q.has('ss') ? parseFloat(Q.get('ss')) : (Q.has('export') ? 2 : 1), scale: Q.has('scale') ? parseFloat(Q.get('scale')) : 1, export: Q.has('export') };
    FG.film.init(document.getElementById('gl'), document.getElementById('out'), opts).then(function (film) {
      window.__piece = {
        renderAt: function (t, o) { return film.renderAt(t, o || {}); },
        grab: function () { return film.grab(); },
        info: film.info,
        ready: true
      };
      if (Q.has('export')) return;
      if (Q.has('t')) { film.renderAt(parseFloat(Q.get('t')), {}); return; }
      var hint = document.getElementById('hint'), f = 0, paused = false;
      document.getElementById('out').addEventListener('click', function () { paused = !paused; });
      function tick() {
        if (!paused) { film.renderAt(f / 30, {}); hint.textContent = (f / 30).toFixed(2) + ' s'; f = (f + 1) % 1200; }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  })();
</script>
</body>
</html>
