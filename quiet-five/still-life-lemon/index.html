<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Still Life with Lemon</title>
<style>
  :root { --bg: #090706; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; aspect-ratio: 4 / 5; }
  #bar { position: fixed; left: 0; bottom: 0; height: 2px; width: 0; background: rgba(160, 140, 100, 0.25); transition: width 0.2s, opacity 1s; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<div id="bar"></div>
<script src="js/core.js"></script>
<script src="js/scene.js"></script>
<script src="js/peel.js"></script>
<script src="js/paint.js"></script>
<script src="js/piece.js"></script>
<script>
(function () {
  'use strict';
  const Q = window.Q;
  const params = new URLSearchParams(location.search);
  const exportMode = params.has('export');
  const tFreeze = params.has('t') ? parseFloat(params.get('t')) : null;
  const hi = params.get('q') === 'hi' || exportMode;
  // internal resolution: 4K (2160x2700) for export / ?q=hi, 1080x1350 for live viewing
  const W = hi ? 2160 : 1080, H = hi ? 2700 : 1350;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const bar = document.getElementById('bar');
  const piece = Q.makePiece({ W, H });
  let last = null;

  function draw(t, scale) {
    const rgba = piece.renderRGBA(t, scale);
    if (canvas.width !== piece.outW) { canvas.width = piece.outW; canvas.height = piece.outH; }
    ctx.putImageData(new ImageData(rgba, piece.outW, piece.outH), 0, 0);
    last = rgba;
    return { w: piece.outW, h: piece.outH };
  }

  if (exportMode) {
    window.__piece = {
      loop: Q.LOOP,
      ready: false,
      init() { piece.initSync(); this.ready = true; return true; },
      // t in seconds (0..L); opts.scale: 1 => 2160x2700, 0.5 => 1080x1350
      renderAt(t, opts) { return draw(t, (opts && opts.scale) || 0.5); },
      rgbaBase64() {
        let s = '';
        const CH = 0x8000;
        for (let i = 0; i < last.length; i += CH) s += String.fromCharCode.apply(null, last.subarray(i, i + CH));
        return btoa(s);
      },
    };
    if (tFreeze !== null) { window.__piece.init(); draw(tFreeze, hi ? 1 : 0.5); }
    return;
  }

  piece.initAsync((p) => { bar.style.width = (p * 100).toFixed(1) + '%'; }).then(() => {
    bar.style.opacity = '0';
    const scale = 1; // live: internal res is already 1080x1350
    if (tFreeze !== null) { draw(tFreeze, scale); return; }
    const t0 = performance.now();
    function frame() {
      const t = (((performance.now() - t0) / 1000) % Q.LOOP);
      draw(t, scale);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
