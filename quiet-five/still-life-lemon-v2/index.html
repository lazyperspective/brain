<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Still Life with Lemon</title>
<style>
  :root { --bg: #0a0806; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; aspect-ratio: 4 / 5; }
  #bar { position: fixed; left: 0; bottom: 0; height: 2px; width: 0; background: rgba(160, 140, 100, 0.3); transition: opacity 1s; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<div id="bar"></div>
<script src="js/engine.js"></script>
<script src="js/geom.js"></script>
<script src="js/peel.js"></script>
<script src="js/scene.js"></script>
<script src="js/piece.js"></script>
<script>
(function () {
  'use strict';
  const q = new URLSearchParams(location.search);
  const exportMode = q.has('export');
  const tFreeze = q.has('t') ? parseFloat(q.get('t')) : null;
  // internal scale: 1 => paints natively at 2160x2700; 0.5 => 1080x1350 (live default)
  const S = parseFloat(q.get('s') || (exportMode || q.get('q') === 'hi' ? '1' : '0.5'));
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const bar = document.getElementById('bar');
  let last = null;
  function draw(t, scale) {
    const fr = renderFrame(t, scale);
    if (canvas.width !== fr.w) { canvas.width = fr.w; canvas.height = fr.h; }
    ctx.putImageData(new ImageData(fr.rgba, fr.w, fr.h), 0, 0);
    last = fr;
    return { w: fr.w, h: fr.h };
  }
  if (exportMode) {
    window.__piece = {
      loop: LOOP,
      init() { pieceInit(S, m => console.log(m)); return true; },
      // t in seconds (0..LOOP); opts.scale: 1 => internal resolution, 0.5 => half
      renderAt(t, opts) { if (!PIECE.ready) this.init(); return draw(t, (opts && opts.scale) || 1); },
      rgbaBase64() {
        let s = ''; const CH = 0x8000, a = last.rgba;
        for (let i = 0; i < a.length; i += CH) s += String.fromCharCode.apply(null, a.subarray(i, i + CH));
        return btoa(s);
      },
    };
    if (tFreeze !== null) { window.__piece.init(); draw(tFreeze, 1); window.__done = true; }
    return;
  }
  bar.style.width = '30%';
  setTimeout(function () {
    pieceInit(S);
    bar.style.width = '100%'; bar.style.opacity = '0';
    if (tFreeze !== null) { draw(tFreeze, 1); return; }
    const t0 = performance.now();
    (function frame() {
      draw(((performance.now() - t0) / 1000) % LOOP, 1);
      requestAnimationFrame(frame);
    })();
  }, 30);
})();
</script>
</body>
</html>
