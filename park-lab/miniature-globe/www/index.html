<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body><canvas id="c" width="1080" height="1080"></canvas>
<script type="module">
const mode = new URLSearchParams(location.search).get('mode') || 'tilt';
try {
  const mod = await import(mode === 'tilt' ? './tilt.js' : './globe.js');
  const app = mod.setup(document.getElementById('c'));
  window.renderFrame = (i) => { app.renderAt(i / app.fps, i); return document.getElementById('c').toDataURL('image/png'); };
  window.renderTime = (t, i) => { app.renderAt(t, i ?? Math.round(t * app.fps)); return document.getElementById('c').toDataURL('image/png'); };
  window.ready = true;
} catch (e) { window.err = String(e && e.stack || e); }
</script></body></html>
