<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flicker</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05040f; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  </style>

<body>
  <canvas id="art" aria-label="Pixel art. Night after rain: a giant green rooftop sign on a hotel tower, its steel frame and catwalk lit by its glow, a halo in the mist, a glass tower reflecting it, puddles on a roof in the foreground. One letter and part of the emblem sputter, and once a loop the whole sign browns out and surges back."></canvas>
  <script src="js/util.js"></script>
  <script src="js/glyphs.js"></script>
  <script src="js/flicker.js"></script>
  <script src="js/px/palette.js"></script>
  <script src="js/px/build.js"></script>
  <script src="js/px/frame.js"></script>
  <script src="js/px/main.js"></script>
</body>
</html>
