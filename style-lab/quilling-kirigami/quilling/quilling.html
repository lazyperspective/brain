    const R = rr(0.2, 0.5), x = rr(2.4, 12), y = rr(-12, 0.9);
    if (!inPoly(x - R * 1.05, y, cliffPoly) || !inPoly(x, y + R * 1.1, cliffPoly) || !inPoly(x, y - R, cliffPoly)) continue;
    if (y + R > 0.95) continue;
    let ok = true; for (const c of cliffCoils) if (Math.hypot(c.x - x, c.y - y) < c.R + R + 0.04) { ok = false; break; }
    if (!ok) continue;
    const kind = rnd();
    cliffCoils.push({ x, y, R, kind: kind < 0.4 ? 'marq' : kind < 0.7 ? 'tear' : 'round', ax: rr(-0.4, 0.4), tip: rr(0, 6.28), rot: rr(0, 6.28), col: jitterCol(CC[Math.floor(rnd() * CC.length)], 0.05), d: rr(0, 1) });
  }
}
const bushes = [];
for (let k = 0; k < 14; k++) { const x = rr(2.8, 11); if (Math.abs(x - LH.x) < 1.3) continue; bushes.push({ x, R: rr(0.2, 0.42), d: rr(0, 0.8), col: jitterCol(hex(rnd() < 0.5 ? '#4f7a4a' : '#6b8f4e'), 0.06), tip: rr(1.2, 1.9) }); }
const rocks = [];
for (let k = 0; k < 9; k++) rocks.push({ x: rr(3.0, 5.5), y: rr(-9.5, -3.0), R: rr(0.18, 0.35), col: jitterCol(hex('#5b4f4a'), 0.08) });

// whale tail outline in local coords (base of stalk at origin, height ~2.6)
const flukeCtrl = [[-0.38, -0.6], [-0.3, 0.6], [-0.42, 1.3], [-0.9, 1.75], [-1.75, 2.35], [-1.55, 2.6], [-0.75, 2.38], [-0.1, 2.15], [0.0, 2.05], [0.1, 2.15], [0.75, 2.38], [1.55, 2.6], [1.75, 2.35], [0.9, 1.75], [0.42, 1.3], [0.3, 0.6], [0.38, -0.6]];
const flukeOutline = resample(catmull(flukeCtrl.map(p => [p[0] * 1.25, p[1] * 1.25]), 16), 0.035);
const FLUKE_SIGN = (() => { const o = offsetPath(flukeOutline, 0.1); let n = 0; for (const p of o) if (inPoly(p[0], p[1], flukeOutline)) n++; return n > o.length / 2 ? 1 : -1; })();
function minDist(p, pts) { let m = 1e9; for (const q of pts) { const d = (p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2; if (d < m) m = d; } return Math.sqrt(m); }
function splitJumps(pts) { const out = []; for (let i = 0; i < pts.length; i++) { if (i > 0 && Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]) > 0.15) out.push([1e9, 1e9]); out.push(pts[i]); } return out; }

// ---------- per-frame strip build ----------
function buildStrips(t) {
  const S = []; // strips
  const E = []; // emissive strips
  const push = (pts, col, opt = {}) => { if (pts.length > 1) S.push({ pts, col, h: (opt.h || STRIP_H), lean: opt.lean ?? 0.025, leanPh: opt.leanPh ?? (pts[0][0] * 3.1), u0: opt.u0 ?? rnd() * 5 }); };
  const live = Math.sin(t * 2.2);
  seed = 777; // keep per-frame random (u offsets) stable

  // --- sky bands: laid down left to right in the first 0.6 s, already mostly placed
  for (const b of skyBands) {
    const raw = []; for (let x = -13; x <= 13; x += 0.05) raw.push([x, b.y + b.amp * Math.sin(x * b.f + b.ph)]);
    const r = smooth(0, 0.9, t * 1.6 + 0.55 - b.d);
    const n = Math.max(2, Math.floor(raw.length * r));
    for (const run of clipRuns(raw.slice(0, n), (x, y) => skyFree(x, y) && !inBeam(x, y, 0.12))) push(run, b.col, { h: STRIP_H * 0.85, lean: b.lean, leanPh: b.leanPh });
  }
  // moon: tight disc coil + halo rings
  {
    const e = spring(t * 1.2 + 0.25);
    const R = 1.3 * lerp(0.35, 1, e);
    push(tightCoil(MOON[0], MOON[1], R, lerp(0.035, 0.11, e), t * 0.3), hex('#f7ecc6'), { h: STRIP_H * 1.05 });
    push(catmull([0, 1, 2, 3, 4, 5, 6, 7].map(i => [MOON[0] + Math.cos(i * 0.785) * 1.36, MOON[1] + Math.sin(i * 0.785) * 1.36]), 18, true), hex('#fff6dc'), { h: STRIP_H * 1.15 });
    const rings = [[1.8, '#f3d58a'], [2.2, '#e9b28a'], [2.6, '#c99ab8']];
    rings.forEach(([rad, c], i) => {
      const r = smooth(0, 1, t * 1.4 - i * 0.15 + 0.3);
      const a0 = 0.3 + i, span = Math.PI * 2 * 0.86 * r;
      const pts = []; for (let a = a0; a < a0 + span; a += 0.03 / rad) pts.push([MOON[0] + Math.cos(a) * rad, MOON[1] + Math.sin(a) * rad]);
      push(revealPts(pts, 1), hex(c), { h: STRIP_H * 0.9 });
    });
  }
  // stars: tiny tight coils that pop up
  for (const s of stars) {
    const e = spring(t * 1.5 - s.d * 0.6 + 0.2);
    if (e <= 0.02) continue;
    push(tightCoil(s.x, s.y, s.r * e, 0.045, s.rot + t), hex('#fbe7a8'), { h: STRIP_H * 0.8 * Math.min(1, e) });
  }
  // clouds
  for (const c of cloudCoils) {
    const e = spring(t * 1.25 - c.d * 0.5 + 0.15);
    if (e <= 0.02) continue;
    const fn = c.kind == 'tear' ? teardrop(c.tip, 0.75) : c.kind == 'marq' ? marquise(0, 0.9) : roundS;
    const turns = Math.round(c.R * 9);
    push(looseCoil(c.x + 0.05 * Math.sin(t * 0.8 + c.x), c.y, c.R, turns, fn, c.rot, Math.min(1.08, e)), c.col);
  }
  // cliff
  {
    push(resample(cliffFace, 0.04), hex('#4a3328'), { h: STRIP_H * 1.15 });
    push(resample(cliffTop, 0.04), hex('#5d7d43'), { h: STRIP_H * 1.1 });
    // crimped grass strip along the top
    const grass = resample(cliffTop, 0.03).map((p, i) => [p[0], p[1] - 0.18 + 0.06 * Math.sin(i * 1.7)]);
    push(grass, hex('#7aa052'));
    for (const c of cliffCoils) {
      const e = Math.min(1.06, spring(t * 1.4 - c.d * 0.35 + 0.35));
      if (e < 0.02) continue;
      const fn = c.kind == 'marq' ? marquise(c.ax, 0.6) : c.kind == 'tear' ? teardrop(c.tip, 0.5) : roundS;
      push(looseCoil(c.x, c.y, c.R, Math.max(3, Math.round(c.R * 11)), fn, c.rot, e), c.col);
    }
    for (const b of bushes) {
      const e = spring(t * 1.3 - b.d * 0.5 + 0.2); if (e < 0.02) continue;
      const yy = 1.25 + 0.2 * Math.sin(b.x * 2) + b.R * 0.9;
      push(looseCoil(b.x, yy, b.R, Math.round(b.R * 12), teardrop(b.tip, 0.8), b.x, Math.min(1.08, e)), b.col);
    }
    for (const r of rocks) push(tightCoil(r.x, r.y, r.R, 0.06, r.x), r.col);
  }
  // lighthouse
  {
    const x = LH.x, yb = LH.base, yt = LH.top;
    const wB = 0.95, wT = 0.62;
    const L = [[x - wB, yb], [x - wT, yt]], R = [[x + wB, yb], [x + wT, yt]];
    const white = hex('#f4efe6'), red = hex('#c2403a');
    push(resample([[x - wB, yb], [x - wT, yt], [x + wT, yt], [x + wB, yb], [x - wB, yb]], 0.04), white, { h: STRIP_H * 1.2 });
    // horizontal ribs: red / white bands
    for (let k = 1; k < 18; k++) {
      const f = k / 18, y = lerp(yb, yt, f), w = lerp(wB, wT, f) - 0.05;
      const band = Math.floor(f * 6) % 2 == 1;
      push(resample([[x - w, y], [x + w, y]], 0.04), band ? red : white, { h: STRIP_H * 0.95 });
    }
    // door
    push(resample(catmull([[x - 0.22, yb], [x - 0.22, yb + 0.45], [x, yb + 0.62], [x + 0.22, yb + 0.45], [x + 0.22, yb]], 8), 0.035), hex('#5a3a2c'));
    // gallery
    push(resample([[x - 0.95, yt], [x - 0.95, yt + 0.28], [x + 0.95, yt + 0.28], [x + 0.95, yt], [x - 0.95, yt]], 0.04), hex('#3c3a40'), { h: STRIP_H * 1.25 });
    // lamp room
    push(resample([[x - 0.55, yt + 0.28], [x - 0.55, yt + 1.15], [x + 0.55, yt + 1.15], [x + 0.55, yt + 0.28]], 0.04), hex('#3c3a40'), { h: STRIP_H * 1.2 });
    // roof
    push(resample([[x - 0.78, yt + 1.15], [x, yt + 1.95], [x + 0.78, yt + 1.15], [x - 0.78, yt + 1.15]], 0.04), red, { h: STRIP_H * 1.2 });
    push(tightCoil(x, yt + 2.05, 0.12, 0.05), red);
    // lamp coils (emissive)
    E.push({ pts: tightCoil(LAMP[0], LAMP[1] - 0.05, 0.32, 0.07, t * 0.8), col: hex('#ffd77a'), h: STRIP_H * 1.0, lean: 0, u0: 0 });
    // beam: radial pale strips laid inside the wedge cut through the sky bands
    for (let k = -2; k <= 2; k++) {
      const a = BEAM_ANG + k * BEAM_HALF * 0.42; const len = 13 - Math.abs(k) * 1.5;
      const pts = []; for (let d = 1.25; d < len; d += 0.05) { const x = LAMP[0] + Math.cos(a) * d, y = LAMP[1] + Math.sin(a) * d; if (!skyFree(x, y, -0.3) && !(Math.abs(x - LH.x) < 1.5)) break; pts.push([x, y, 1 - 0.5 * d / len]); }
      if (pts.length > 2) push(pts, hex(Math.abs(k) == 2 ? '#f1cf86' : '#fbe9b8'), { h: STRIP_H * 0.9, lean: 0.02 });
    }
  }
  // sea: long wave lines
  for (const wl of waveLines) {
    const raw = []; for (let x = -13; x <= 6; x += 0.05) raw.push([x, wl.y + wl.amp * Math.sin(x * wl.f + wl.ph + t * 1.2)]);
    for (const run of clipRuns(raw, (x, y) => seaFree(x, y, 0) && !inPoly(x + 0.15, y, cliffPoly))) push(run, wl.col, { h: STRIP_H * 0.9 });
  }
  // sea: curling waves (Euler-spiral curls that coil into place, then breathe)
  for (const w of waves) {
    const start = 0.05 + (w.x + 13) / 19 * 0.9 + w.d * 0.4 - w.row * 0.03;
    const c = clamp(spring((t - start) * 1.6), 0, 1.12);
    const r = smooth(start - 0.35, start + 0.1, t);
    if (r <= 0.01) continue;
    const L = 3.3 * w.sc;
    const kEnd = 1 / (0.07 * w.sc + 0.02);
    const kfun = (s) => -kEnd * Math.pow(s / L, 1.7);
    const breathe = 1 + 0.03 * Math.sin(t * 2.6 + w.ph);
    const pts = curvePath(w.x, w.y, 0.95 + 0.04 * Math.sin(t * 2 + w.ph), L, kfun, Math.max(0.0, c) * breathe, 1, 0.035);
    push(revealPts(pts, r), w.col, { lean: w.lean, leanPh: w.leanPh });
    // inner echo curl on the bigger waves (paired strips are typical in quilling)
    const nest = [[0.16, 0.8, '#7fc4cc'], [0.31, 0.6, '#c9ecea']];
    for (const [o, lf, cc] of nest) {
      const L2 = L * lf;
      const pts2 = curvePath(w.x + o * w.sc, w.y - 0.03, 0.95, L2, (s) => -kEnd * (L / L2) * 0.9 * Math.pow(s / L2, 1.7), Math.max(0, c) * breathe, 1, 0.035);
      push(revealPts(pts2, smooth(start - 0.25, start + 0.2, t)), jitterCol(hex(cc), 0.05), { h: STRIP_H * (o > 0.2 ? 0.75 : 0.88) });
    }
  }
  // whale tail rising out of the sea
  {
    const rise = smooth(0.9, 2.5, t);
    const lift = -3.3 + rise * 3.3;  // local y offset
    const tilt = 0.18 * (1 - rise) + 0.05 * Math.sin(t * 2.4);
    const wl = WHALE[1]; // waterline
    const xf = (p, s = 1) => { const x = p[0] * s, y = p[1] * s + lift; return [WHALE[0] + x * Math.cos(tilt) - y * Math.sin(tilt), wl + x * Math.sin(tilt) + y * Math.cos(tilt)]; };
    const hRise = smooth(0.9, 1.6, t);
    const keep = (x, y) => Math.abs(x) < 1e5 && Math.abs(y) < 1e5 && y > wl + 0.05 * Math.sin(x * 4 + t * 3);
    const dark = hex('#3e4f66'), mid = hex('#5b6f88');
    for (const run of clipRuns(flukeOutline.map(p => xf(p)), keep)) push(run, dark, { h: STRIP_H * 1.15 * hRise + 0.01 });
    for (const [o, cc] of [[0.12, mid], [0.24, hex('#71859e')], [0.36, hex('#8798ad')]]) {
      const inner = offsetPath(flukeOutline, FLUKE_SIGN * o).filter(p => inPoly(p[0], p[1], flukeOutline) && minDist(p, flukeOutline) > o * 0.75);
      for (const run of clipRuns(splitJumps(inner).map(p => xf(p)), keep)) push(run, cc, { h: STRIP_H * (1.05 - o * 0.6) * hRise + 0.01 });
    }

    for (const sgn of [-1, 1]) {
      const cpos = xf([sgn * 1.25, 2.85]);
      if (keep(cpos[0], cpos[1])) push(looseCoil(cpos[0], cpos[1], 0.26, 4, marquise(sgn * -0.45 + tilt, 0.8), tilt, smooth(1.3, 2.1, t) * 0.7 + 0.3), hex('#7f93ad'), { h: STRIP_H * hRise });
    }

    const sp = spring((t - 1.0) * 1.4);
    if (sp > 0.02) {
      for (const sgn of [-1, 1]) {
        const pts = curvePath(WHALE[0] + sgn * 0.5, wl + 0.02, sgn < 0 ? Math.PI - 0.5 : 0.5, 1.3, (s) => -sgn * 5.5 * Math.pow(s / 1.3, 1.5), Math.min(1.1, sp), 1, 0.03);
        push(pts, hex('#bfe6ea'), { h: STRIP_H * 0.9 });
      }
      for (let k = 0; k < 6; k++) {
        const a = Math.PI * (0.15 + 0.7 * k / 5), d = 0.6 + 1.2 * sp + 0.15 * (k % 2);
        const dp = [WHALE[0] + Math.cos(a) * d * 1.1, wl + 0.2 + Math.sin(a) * d * 0.8 - 0.25 * Math.max(0, t - 2.2) ** 2 * 4];
        if (dp[1] > wl) push(tightCoil(dp[0], dp[1], 0.1 * Math.min(1, sp) + 0.02, 0.04, k), hex('#d8f1f2'), { h: STRIP_H * 0.7 });
      }
    }
  }
  // boat bobbing
  {
    const bob = 0.07 * Math.sin(t * 2.4), roll = 0.07 * Math.sin(t * 2.4 + 1.1);
    const xf = (p) => { const x = p[0], y = p[1]; return [BOAT[0] + x * Math.cos(roll) - y * Math.sin(roll), BOAT[1] + bob + x * Math.sin(roll) + y * Math.cos(roll)]; };
    const hull = catmull([[-1.2, 0.35], [-0.95, -0.05], [-0.4, -0.3], [0.5, -0.3], [1.05, -0.05], [1.3, 0.38]], 10);
    push(resample([...hull, [-1.2, 0.35]].map(xf), 0.035), hex('#8a4b2e'), { h: STRIP_H * 1.1 });
    for (let k = 1; k < 4; k++) { const y = 0.33 - k * 0.15, w = 1.12 - k * 0.12; push(resample([[-w, y], [w, y]].map(xf), 0.04), hex(k % 2 ? '#b0683d' : '#9a5634')); }
    push(resample([[0.05, 0.35], [0.05, 2.0]].map(xf), 0.04), hex('#5a3a2a'), { h: STRIP_H * 1.15 });
    const sail = [[0.15, 0.55], [0.15, 1.9], [1.05, 0.55], [0.15, 0.55]];
    push(resample(sail.map(xf), 0.035), hex('#f1e6cf'), { h: STRIP_H * 1.1 });
    push(resample([[0.28, 0.68], [0.28, 1.5], [0.82, 0.68], [0.28, 0.68]].map(xf), 0.035), hex('#e9c9a0'));
    push(resample([[-0.05, 0.55], [-0.05, 1.55], [-0.75, 0.55], [-0.05, 0.55]].map(xf), 0.035), hex('#efe0c4'), { h: STRIP_H * 1.05 });
    // flag
    push(resample([[0.05, 2.0], [0.45, 1.9 + 0.04 * Math.sin(t * 6)], [0.05, 1.8]].map(xf), 0.03), hex('#c2403a'));
  }
  return { S, E };
}

function updateBase(S) {

  g.strokeStyle = 'rgb(95,85,95)'; g.lineWidth = 0.09 * pxu; g.lineJoin = 'round'; g.lineCap = 'round';
  g.beginPath();
  for (const s of S) { const p = s.pts; if (s.h < 0.12) continue; let q = toPx(p[0][0], p[0][1]); g.moveTo(q[0], q[1]); for (let i = 1; i < p.length; i++) { q = toPx(p[i][0], p[i][1]); g.lineTo(q[0], q[1]); } }

  g.filter = `blur(${(0.22 * pxu).toFixed(1)}px)`;
  g.strokeStyle = 'rgb(175,165,175)'; g.lineWidth = 0.3 * pxu; g.stroke();
  g.filter = 'none'; g.globalCompositeOperation = 'source-over';
  baseTex.needsUpdate = true;
}

window.renderFrame = function (i) {
  const t = i / FPS;
  BEAM_ANG = Math.PI * (0.935 + 0.1 * t / 3);
  const { S, E } = buildStrips(t);
  if (stripMesh) { stripMesh.geometry.dispose(); scene.remove(stripMesh); }
  if (lampMesh) { lampMesh.geometry.dispose(); scene.remove(lampMesh); }
  stripMesh = new THREE.Mesh(buildGeometry(S), stripMat); stripMesh.castShadow = stripMesh.receiveShadow = true; scene.add(stripMesh);
  lampMesh = new THREE.Mesh(buildGeometry(E), lampMat); scene.add(lampMesh);
  updateBase([...S, ...E]);

  // beam sweep (turning lamp): sweeps across sky toward the sea
  const ang = BEAM_ANG;
  beam.target.position.set(LAMP[0] + Math.cos(ang) * 8, LAMP[1] + Math.sin(ang) * 8, 0.0);
  const flick = 1 + 0.06 * Math.sin(t * 31) + 0.04 * Math.sin(t * 17.3);
  beam.intensity = 260 * flick; lampGlow.intensity = 7 * flick; lampMat.emissiveIntensity = 1.6 * flick;

  // camera: slow dolly + slight orbit
  const u = smooth(0, 3, t) * 0.7 + t / 3 * 0.3;
  const cx = lerp(-2.0, 1.0, u), cy = lerp(-19.0, -18.0, u), cz = lerp(18.6, 17.8, u);
  camera.position.set(cx, cy, cz);
  camera.up.set(0, 0, 1);
  const tgt = new THREE.Vector3(lerp(0.0, 0.5, u), lerp(-0.3, 0.0, u), 0);
  camera.lookAt(tgt);
  const focusPt = new THREE.Vector3(WHALE[0], WHALE[1] + 1.5, 0.2);
  bokeh.uniforms['focus'].value = camera.position.distanceTo(focusPt);
  finish.uniforms.uTime.value = t;
  composer.render();
  return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script>
</body></html>
